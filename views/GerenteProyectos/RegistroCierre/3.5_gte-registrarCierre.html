<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cierre - Nodex (Gerente)</title>
    <link rel="stylesheet" href="css-gteproyectos/gte-dashboard.css">
</head>
<body>

<header>
    <h1>Nodex - Plataforma Logística</h1>
    <p>Cierre de Presupuesto (Gerente de Proyectos)</p>
    <nav>
        <a href="../3_gte-dashboard.html"     >Panel principal  </a> |
        <a href="3.5_gte-registrarCierre.html">Registrar Cierre </a> |
        <a href="3.6_gte-consultarCierre.html">Transacciones    </a> |
        <a href="../../../auth/1.1_login.html">Cerrar sesión    </a>
    </nav>
</header>

<hr>

<main>
    <h2>Registrar Cierre de Presupuesto por Habitación <small>(RF-3.5)</small></h2>
    <form action="#" method="POST">
        <p>
            <label for="id_cierre">ID de Cierre Asignado:</label><br>
            <input type="text" id="id_cierre" name="id_cierre" value="CIER-103" readonly style="background-color: #e9ecef;">
        </p>
        <p>
            <label for="proyecto_area">Seleccionar Proyecto y Área Arquitectónica:</label><br>
            <select id="proyecto_area" name="proyecto_area">
                <option>Torre Corporativa Alfa - Centro de Datos A1</option>
                <option>Torre Corporativa Alfa - Oficinas Piso 1</option>
                <option>Laboratorio de Redes - Sala de Pruebas B2</option>
            </select>
        </p>
        <p>
            <label for="costo_materiales">Costo Consolidado de Materiales (Cable + Hardware):</label><br>
            <input type="text" id="costo_materiales" name="costo_materiales" placeholder="Ej. $45,200.00 MXN" required>
        </p>
        <p>
            <label for="costo_mano_obra">Costo Estimado de Mano Obra / Instalación:</label><br>
            <input type="text" id="costo_mano_obra" name="costo_mano_obra" placeholder="Ej. $12,000.00 MXN" required>
        </p>
        <p>
            <label for="responsable">Gerente Responsable de la Validación:</label><br>
            <input type="text" id="responsable" name="responsable" value="Ricardo Avalos Vargas" readonly style="background-color: #e9ecef;">
        </p>
        <p>
            <label for="observaciones">Observaciones Financieras y Notas de Cierre:</label><br>
            <textarea id="observaciones" name="observaciones" rows="4" cols="50" placeholder="Detallar condiciones del presupuesto congelado, desviaciones o acuerdos con el cliente."></textarea>
        </p>
        <p>
            <button type="submit">Congelar y Cerrar Presupuesto</button>
            <a href="3.6_gte-consultarCierre.html"><button type="button">Ver Transacciones Previas</button></a>
        </p>
    </form>
</main>

<hr>
<footer>
    <p><a href="../3_gte-dashboard.html">&larr; Volver al Panel Principal</a></p>
    <p>Prototipo Nodex &mdash; AEB-1055 Programación Web</p>
</footer>

</body>
</html>
