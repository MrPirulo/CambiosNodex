<body>

<header>
    <h1>Nodex - Plataforma Logística</h1>

    <nav>
        <a href="3_gte-dashboard.html">Panel principal</a> |

<hr>

<main>
    <h2>Registrar Cierre de Presupuesto por Habitación <small>(RF-3.5)</small></h2>
    <form action="#" method="POST">
        <p>
            <label for="proyecto_area">Seleccionar Proyecto y Área:</label><br>
            <select id="proyecto_area" name="proyecto_area">
                <option>Torre Corporativa Alfa - Centro de Datos A1</option>
                <option>Torre Corporativa Alfa - Oficinas Piso 1</option>
            </select>
        </p>
        <p>
            <label for="observaciones">Observaciones Financieras Iniciales:</label><br>
            <textarea id="observaciones" name="observaciones" rows="4" cols="50" placeholder="Presupuesto consolidado sujeto a validación final."></textarea>
        </p>
        <p>
            <button type="submit">Congelar y Cerrar Presupuesto</button>
            <a href="3.6_gte-consultarCierre.html"><button type="button">Ver Transacciones Previas</button></a>
        </p>
    </form>
</main>
