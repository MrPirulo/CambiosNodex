<hr>

<main>
    <h2>Registrar cálculo de metraje <small>(RF-2.6)</small></h2>
    <form action="2.7_calculos-listado.html" method="post">
        <fieldset>
            <legend>Datos de Metraje</legend>
            <p>
                <label for="area">Área Arquitectónica:</label><br>
                <select id="area" name="area" required>
                    <option value="A1">Edificio F - Planta Baja</option>
                </select>
            </p>
            <p>
                <label for="nodo">Identificador del Nodo:</label><br>
                <input type="text" id="nodo" name="nodo" placeholder="Ej. Nodo-101A" required>
            </p>
            <p>
                <label for="distancia">Distancia calculada (m):</label><br>
                <input type="number" step="0.5" id="distancia" name="distancia" required>
            </p>
        </fieldset>
        <p>
            <button type="submit">Guardar Cálculo</button>
            <button type="reset">Limpiar</button>
        </p>
    </form>
    <p><a href="2.7_calculos-listado.html"> Cancelar y regresar al listado</a></p>
</main>

<hr>
<footer>
    <p>Prototipo Nodex &mdash; AEB-1055 Programación Web</p>
