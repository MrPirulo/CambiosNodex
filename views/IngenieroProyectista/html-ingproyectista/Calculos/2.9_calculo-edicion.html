<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Editar Cálculo</title>
</head>
<body>

<header>
    <h1>NODEX</h1>
    <p>Panel del Ing. Proyectista &mdash; Memoria de Cálculo</p>
    <nav>
        <a href="../ing-dashboard.html">Panel principal</a> |
        <a href="../Cables/2.2_cables-listado.html">Cables</a> |
        <a href="../Calculos/2.7_calculos-listado.html">Cálculos de Metraje</a> |
        <a href="../Asignaciones/2.12_asignaciones-listado.html">Asignaciones Hardware</a> |
        <a href="../../../../auth/1.1_login.html">Cerrar sesión</a>
    </nav>
</header>

<hr>

<main>
    <h2>Modificar cálculo de metraje <small>(RF-2.9)</small></h2>
    <form action="2.7_calculos-listado.html" method="post">
        <fieldset>
            <legend>Actualizar Datos</legend>
            <p>
                <label for="id">ID Transacción:</label><br>
                <input type="text" id="id" name="id" value="TRX-100" readonly>
            </p>
            <p>
                <label for="nodo">Identificador del Nodo:</label><br>
                <input type="text" id="nodo" name="nodo" value="Nodo-101A" required>
            </p>
            <p>
                <label for="distancia">Distancia calculada (m):</label><br>
                <input type="number" step="0.5" id="distancia" name="distancia" value="45.5" required>
            </p>
        </fieldset>
        <p><button type="submit">Actualizar Cálculo</button></p>
    </form>
    <p><a href="2.7_calculos-listado.html"> Cancelar y regresar al listado</a></p>
</main>

<hr>
<footer>
    <p>Prototipo Nodex &mdash; AEB-1055 Programación Web</p>
</footer>
</body>
</html>
