<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../1_CSS/superv-form.css">
    <title>Registrar Componente - Nodex</title>
</head>
<body>

<header>
    <h1>Nodex - Plataforma Logística</h1>
    <p>Registro de Hardware (Supervisor de Logística)</p>
    <nav>
        <a href="../superv-dashboard.html">Panel principal</a> |
        <a href="4.1_superv-registrar.html">Registrar</a> |
        <a href="4.2_superv-catalogo.html">Catálogo</a> |
        <a href="../../index.html">Cerrar sesión</a>
    </nav>
</header>

<hr>

<main>
    <h2>Registrar Nuevo Componente en el Catálogo de Hardware <small>(RF-4.1)</small></h2>
    <form action="#" method="POST" enctype="multipart/form-data">
        <p>
            <label for="nombre_componente">Nombre del Componente (Conector, Jack, Patch Panel):</label><br>
            <input type="text" id="nombre_componente" name="nombre_componente" required placeholder="Ej. Jack RJ45 Cat 6">
        </p>
        <p>
            <label for="precio_unitario">Precio Unitario ($ MXN):</label><br>
            <input type="text" id="precio_unitario" name="precio_unitario" required placeholder="Ej. $45.00">
        </p>
        <p>
            <label for="imagen_hardware">Subir Fotografía del Componente:</label><br>
            <input type="file" id="imagen_hardware" name="imagen_hardware" required>
        </p>
        <p>
            <button type="submit">Guardar Componente</button>
            <a href="4.2_superv-catalogo.html"><button type="button">Ver Catálogo</button></a>
        </p>
    </form>
</main>

<hr>
<footer>
    <p><a href="../superv-dashboard.html">&larr; Volver al Panel Principal</a></p>
    <p>Prototipo Nodex &mdash; AEB-1055 Programación Web</p>
</footer>

</body>
</html>
